[package]
name = "sda-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WASM decoder core: TrueHD / E-AC-3(JOC) / DTS bitstreams -> PCM + object spatial events. Decoder crates come from harletty-bridge."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
truehd = "0.6.3"
eac3 = { version = "0.7.3", path = "../../harletty-bridge/eac3" }
dca = { version = "0.7.3", path = "../../harletty-bridge/dca" }
alac = { version = "0.5.0", default-features = false }
macindecode-ac4-bitstream = { git = "https://github.com/SakuzyPeng/MacinDecode-AC4-Core.git", rev = "a23965312a53d3cfb1a63cbae692a788efe46123" }
macindecode-ac4-scene = { path = "../../vendor/macindecode-ac4-scene", features = ["audio-decode"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Rust 1.98's single-unit TrueHD optimization can exceed 7 GiB on Windows.
[profile.release.package.truehd]
codegen-units = 16
