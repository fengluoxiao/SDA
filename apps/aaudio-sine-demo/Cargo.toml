[package]
name = "sda-aaudio-sine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "T2.1 verification: minimal AAudio low-latency sine from Rust over JNI (one-off demo, not part of the engine)"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = 2
