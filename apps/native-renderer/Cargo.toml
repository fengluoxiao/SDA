[package]
name = "sda-native-renderer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Windows stereo object-rendering sidecar for SDA"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
cpal = "0.15.3"
rustfft = "6.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
