[features]
default = ["cpal-output"]
# `cpal-output` builds the Windows/desktop audio output stack (cpal/WASAPI/ASIO/
# DirectSound + MMCSS). Disable for host test runs on machines where the
# windows crate cannot build, and for engine-only mobile targets.
cpal-output = ["dep:cpal", "dep:windows", "dep:asio-sys"]
pcm-diagnostic = []

[lib]
name = "sda_native_renderer"
path = "src/lib.rs"

[package]
name = "sda-native-renderer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native stereo object-rendering sidecar for SDA (Windows/macOS/Linux)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
cpal = { version = "0.15.3", optional = true }
rustfft = "6.4"
rayon = "1.12"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.5.0", features = ["audio"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.15.3", features = ["asio"], optional = true }
asio-sys = { version = "0.2.6", optional = true }
windows = { version = "0.54.0", optional = true, features = ["Win32_Media_Audio", "Win32_Media_Audio_DirectSound", "Win32_UI_WindowsAndMessaging", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
# Keep bindgen's target ABI correct and opaque C++ driver bookkeeping on MinGW.
asio-sys = { path = "vendor/asio-sys" }
parse_cfg = { path = "vendor/parse_cfg" }

[[example]]
name = "output_sessions"
required-features = ["cpal-output"]
