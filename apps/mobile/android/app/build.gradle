apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = new File(projectDir, "../..").canonicalFile
def sdaReleaseStore = System.getenv('SDA_ANDROID_RELEASE_STORE_FILE')
def sdaReleasePassword = System.getenv('SDA_ANDROID_RELEASE_STORE_PASSWORD')
def sdaReleaseAlias = System.getenv('SDA_ANDROID_RELEASE_KEY_ALIAS')
def sdaReleaseKeyPassword = System.getenv('SDA_ANDROID_RELEASE_KEY_PASSWORD')
def sdaHasReleaseSigning = [sdaReleaseStore, sdaReleasePassword, sdaReleaseAlias, sdaReleaseKeyPassword].every { it != null && !it.trim().isEmpty() }
if ((findProperty('sdaOfficialRelease') ?: 'false').toBoolean() && !sdaHasReleaseSigning) {
    throw new GradleException('Official Android releases require the private SDA_ANDROID_RELEASE_* signing environment.')
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = new File(projectRoot, "index.js")
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(projectRoot, "scripts/expo-embed.cjs")
    bundleCommand = "export:embed"
    bundleConfig = new File(projectRoot, "metro.config.js")
    extraPackagerArgs = ["--max-workers", "2"]

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = projectRoot
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'app.sda.mobile'
    testBuildType = project.findProperty('sdaTestBuildType') ?: "debug"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId 'app.sda.mobile'
        // Both shared native ABIs link libaaudio (Android API 26+).
        minSdkVersion Math.max(26, rootProject.ext.minSdkVersion as int)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 923
        versionName "0.9.22"
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        // RN's architecture property alone does not filter prebuilt AAR/JNI libraries.
        // Keep the final APK restricted to the requested native engine ABI(s).
        ndk {
            abiFilters(*((findProperty('reactNativeArchitectures') ?: 'x86_64')
                .split(',').collect { it.trim() }))
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (sdaHasReleaseSigning) {
                storeFile file(sdaReleaseStore)
                storeType 'PKCS12'
                storePassword sdaReleasePassword
                keyAlias sdaReleaseAlias
                keyPassword sdaReleaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // CI/development packages retain the existing test key; official builds require private signing above.
            signingConfig sdaHasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Mobile-only direct HRIR assets. Never package desktop BRIR/room assets.
def mobileAssets = file('src/main/assets')
def mobileHrtfAssets = file('../../assets')
def sharedAssets = layout.buildDirectory.dir('generated/sharedKu100Assets')
android.sourceSets.main.assets.setSrcDirs([sharedAssets])
def syncSharedKu100Assets = tasks.register('syncSharedKu100Assets', Sync) {
    inputs.dir(new File(projectRoot, 'ios-experiments'))
    inputs.dir(new File(projectRoot, '../../assets/hrtf/apple-hrtfhq-v1'))
    inputs.file(new File(projectRoot, '../../scripts/stage-shared-render-experiment.mjs'))
    def sharedAbis = (project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',').collect { it.trim() }
    inputs.property('sharedHrtfAbis', sharedAbis)
    inputs.files(sharedAbis.collect { file("src/main/jniLibs/${it}/libsda_native.so") })
    from(mobileAssets) { exclude 'hrtf*/**', 'rooms/**', 'rendering-presets.json' }
    from('../../rendering-presets.json')
    from('../../../../vendor/libmpegh') { include 'LICENSE', 'LICENSE2'; into 'licenses/libmpegh' }
    from('../../../../harletty-bridge/eac3') { include 'JOC_INPUT_CONDITIONING_LICENSE'; into 'licenses/joc-input-conditioning' }
    from(mobileHrtfAssets) { include 'hrtf-restored/**' }
    into(sharedAssets)
    doFirst {
        def selected = new groovy.json.JsonSlurper().parse(new File(projectRoot, 'ios-experiments/active.json'))
        if (selected.id == 'apple-hrtfhq-542-v1') {
            sharedAbis.each { abi ->
                def nativeLibrary = file("src/main/jniLibs/${abi}/libsda_native.so")
                if (!nativeLibrary.isFile() || !new String(nativeLibrary.bytes, 'ISO-8859-1').contains('Shared HRTFHQ clarity profile v1')) {
                    throw new GradleException("Shared HRTFHQ requires a rebuilt Rust JNI library for ${abi}; build sda-native before assembling the APK")
                }
            }
        }
        def manifest = new groovy.json.JsonSlurper().parse(new File(mobileHrtfAssets, 'hrtf-restored/hrtf-dense/hrtf-set.json'))
        if (manifest.positions.size() != 61 || manifest.processing.historicalInterpolation != true || manifest.processing.spatialCues != true || manifest.processing.dryTapLimit != 512) {
            throw new GradleException('Expected calibrated 61-direction KU100 with historical interpolation and spatial cues')
        }
    }
    doLast {
        providers.exec {
            workingDir projectRoot
            commandLine 'node', '../../scripts/stage-shared-render-experiment.mjs',
                new File(sharedAssets.get().asFile, 'hrtf-restored').absolutePath
        }.result.get().assertNormalExitValue()
    }
}
tasks.named('preBuild').configure { dependsOn(syncSharedKu100Assets) }

// React Native's default bundle inputs omit JSON. This file is imported by
// App/RemotePlayer as well as copied to native assets: invalidate BOTH outputs.
tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    // Keep source-map paths on the checkout drive when node_modules is linked.
    // Only bundling needs this logical path; CMake retains its resolved inputs.
    def linkedReactNative = new File(projectRoot, '../../node_modules/react-native')
    doFirst {
        // The RN plugin assigns its provider after task registration.
        if (linkedReactNative.isDirectory()) {
            reactNativeDir.set(linkedReactNative)
        }
    }

    inputs.file(new File(projectRoot, 'rendering-presets.json'))
        .withPropertyName('renderingPresets')
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
}


// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
