[package]
name = "sda-airpods-head-tracking"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Windows AirPods AACP head-tracking provider for SDA"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
