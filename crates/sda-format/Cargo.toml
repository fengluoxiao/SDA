[package]
name = "sda-format"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SDAR authored beds, SDA Bed Lossless encoding and private M4A delivery"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
rubato = "0.16.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
