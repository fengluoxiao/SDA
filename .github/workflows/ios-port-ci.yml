name: iOS device package
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Package validation scope for a pinned source
        type: choice
        default: package-only
        options: [package-only]
      release_tag:
        description: Optional existing draft release tag to upload packages to
        required: false
        type: string
      source_ref:
        description: Optional pinned runtime source to package with this workflow
        required: false
        type: string
  push:
    branches: [feat/android-port]
    paths:
      - '.github/workflows/ios-port-ci.yml'
      - 'apps/mobile/**'
      - 'assets/hrtf/**'
      - 'scripts/stage-shared-render-experiment.mjs'
      - 'scripts/prepare-ios-assets.mjs'
      - 'scripts/build-ios-native.sh'
      - 'scripts/record-ios-build.mjs'
      - 'scripts/prepare-mpegh.mjs'
      - 'scripts/prepare-ac4.mjs'
      - 'crates/sda-native/**'
      - 'crates/sda-render-metadata/**'
      - 'vendor/truehd/**'
      - 'apps/native-renderer/**'
      - 'packages/core/**'
      - 'packages/demux/**'
      - 'vendor/avs3a/**'
      - 'vendor/macindecode-ac4-scene/**'
      - 'vendor/macindecode-ac4-decode/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: write
  actions: write
concurrency:
  group: ios-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-cache-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Forward package to the shared build cache
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        with:
          script: |
            const {data:source}=await github.rest.repos.getCommit({...context.repo,ref:process.env.SOURCE_REF});
            const branch=context.payload.repository.default_branch;
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'ios-shared-cache.yml',ref:branch,inputs:{source_ref:source.sha,scope:'package-only',release_tag:process.env.RELEASE_TAG}});
            await core.summary.addHeading('iOS shared build cache').addRaw(`Source: ${source.sha}`).addLink('Open the actual packaging runs',`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ios-shared-cache.yml`).write();
