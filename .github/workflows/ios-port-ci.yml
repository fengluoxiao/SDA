name: iOS device package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing draft release tag to upload packages to
        required: false
        type: string
      source_ref:
        description: Optional pinned runtime source to package with this workflow
        required: false
        type: string
  push:
    branches: [feat/android-port]
    paths:
      - '.github/workflows/ios-port-ci.yml'
      - 'apps/mobile/**'
      - 'assets/hrtf/**'
      - 'scripts/stage-shared-render-experiment.mjs'
      - 'scripts/prepare-ios-assets.mjs'
      - 'scripts/build-ios-native.sh'
      - 'scripts/record-ios-build.mjs'
      - 'scripts/prepare-mpegh.mjs'
      - 'scripts/prepare-ac4.mjs'
      - 'crates/sda-native/**'
      - 'apps/native-renderer/**'
      - 'packages/core/**'
      - 'packages/demux/**'
      - 'vendor/avs3a/**'
      - 'vendor/macindecode-ac4-scene/**'
      - 'vendor/macindecode-ac4-decode/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: write
concurrency:
  group: ios-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: iOS SDK ${{ matrix.sdk }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      matrix:
        sdk: ['26']
    env:
      CI: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/ios-build/cargo
      SDA_IOS_INCLUDE_SIMULATOR: '0'
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      # Preserve the verified source linkage for React and Worklets.
      RCT_USE_PREBUILT_RNCORE: '0'
      RCT_USE_RN_DEP: '0'
      EXPO_USE_PRECOMPILED_MODULES: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
      - name: Select SDK
        id: sdk
        run: |
          mkdir -p ios-artifacts
          python3 scripts/select-ios-sdk.py '${{ matrix.sdk }}'
      - name: Verify output callback recovery policy
        run: python3 scripts/test-ios-output-watchdog.py
      - name: Record build tools
        id: xcode
        run: |
          xcodebuild -version | tee ios-artifacts/xcode.txt
          echo "fingerprint=$(shasum -a 256 ios-artifacts/xcode.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sda-native -> ../../ios-build/cargo
          key: ios-device-${{ matrix.sdk }}-${{ steps.xcode.outputs.fingerprint }}
          cache-on-failure: true
      - name: Validate provenance inputs and pin runtime source
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          export SDA_SOURCE_COMMIT="$source_sha"
          echo "SDA_SOURCE_COMMIT=$source_sha" >> "$GITHUB_ENV"
          if [[ -n "$REQUESTED_SOURCE_REF" && "$GITHUB_WORKFLOW_SHA" != "$source_sha" ]]; then
            # Only the provenance collector comes from the current workflow.
            # All application/Rust/assets remain at the requested source.
            git fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA"
            git show "$GITHUB_WORKFLOW_SHA:scripts/record-ios-build.mjs" > "$RUNNER_TEMP/sda-record-ios-build.mjs"
            cp "$RUNNER_TEMP/sda-record-ios-build.mjs" scripts/record-ios-build.mjs
            changed="$(git diff --name-only)"
            [[ "$changed" == 'scripts/record-ios-build.mjs' ]]
          fi
          node scripts/record-ios-build.mjs --check-inputs
          node scripts/test-ios-output-calibration-provenance.mjs
      - name: Install dependencies and prepare resources
        run: |
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          node scripts/prepare-ios-assets.mjs
      - name: Build device Rust library
        run: |
          set -o pipefail
          GITHUB_SHA="$SDA_SOURCE_COMMIT" bash scripts/build-ios-native.sh 2>&1 | tee ios-artifacts/rust-build.log
      - name: Restore CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/modules/**/*.podspec') }}
          restore-keys: |
            ios-pods-v1-${{ steps.xcode.outputs.fingerprint }}-
      - name: Generate Xcode project and install CocoaPods
        run: |
          set -o pipefail
          cd apps/mobile
          pnpm exec expo prebuild --platform ios --no-install 2>&1 | tee ../../ios-artifacts/prebuild.log
          cd ios
          pod install 2>&1 | tee ../../../ios-artifacts/pods.log
      - name: Restore Xcode compilation cache
        uses: actions/cache@v4
        with:
          path: ios-build/CompilationCache.noindex
          key: ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/modules/sda-core/ios/*.swift', 'apps/mobile/modules/sda-core/ios/*.h', 'apps/mobile/modules/sda-core/ios/Headers/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/modules/sda-core/ios/*.swift', 'apps/mobile/modules/sda-core/ios/*.h', 'apps/mobile/modules/sda-core/ios/Headers/**') }}-
            ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-
      - name: Archive unsigned device app
        run: |
          set -o pipefail
          xcodebuild -showBuildTimingSummary -workspace apps/mobile/ios/SDA.xcworkspace -scheme SDA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ios-build/SDA.xcarchive -derivedDataPath ios-build/device COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES COMPILATION_CACHE_CAS_PATH="$PWD/ios-build/CompilationCache.noindex" COMPILATION_CACHE_LIMIT_SIZE=2G CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET=16.4 archive 2>&1 | tee ios-artifacts/device-build.log
          mkdir -p ios-build/package/Payload
          cp -R ios-build/SDA.xcarchive/Products/Applications/SDA.app ios-build/package/Payload/
          python3 scripts/strip-ios-ci-resources.py ios-build/package/Payload/SDA.app | tee ios-artifacts/production-resource-audit.json
          ditto -c -k --keepParent ios-build/SDA.xcarchive/dSYMs ios-artifacts/SDA-device-dSYMs.zip
          xcrun dwarfdump --uuid ios-build/SDA.xcarchive/Products/Applications/SDA.app/SDA > ios-artifacts/device-uuid.txt
          node scripts/record-ios-build.mjs ios-artifacts
          cd ios-build/package
          zip -qry ../../ios-artifacts/SDA-unsigned-ios16.4-arm64.ipa Payload
          cd ../..
          printf 'Unsigned arm64 IPA; minimum iOS 16.4. Device-only packaging; no automated test or simulator run. Requires signing for installation.\n' > ios-artifacts/README.txt
      - name: Upload versioned package to requested draft release
        if: ${{ inputs.release_tag != '' }}
        env:
          SDA_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upload-mobile-release.mjs iOS
      - name: Record compilation timings
        if: always()
        run: python3 scripts/summarize-ios-build-timings.py ios-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDA-iOS-SDK${{ matrix.sdk }}-${{ github.run_number }}
          path: ios-artifacts/
          retention-days: 14
