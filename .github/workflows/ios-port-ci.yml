name: iOS device package
on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: package-only
      source_ref:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      scope:
        description: Package scope
        required: true
        default: 'package-only'
        type: choice
        options:
          - package-only
      release_tag:
        description: Optional existing draft release tag to upload packages to
        required: false
        type: string
      source_ref:
        description: Optional pinned runtime source to package with this workflow
        required: false
        type: string
  repository_dispatch:
    types: [motion-artwork-package]
  push:
    branches: [feat/android-port, codex/ios-personal-hrtf-local-20261119]
    paths:
      - '.github/workflows/ios-port-ci.yml'
      - 'apps/mobile/**'
      - 'assets/hrtf/**'
      - 'scripts/stage-shared-render-experiment.mjs'
      - 'scripts/prepare-ios-assets.mjs'
      - 'scripts/build-ios-native.sh'
      - 'scripts/record-ios-build.mjs'
      - 'scripts/prepare-mpegh.mjs'
      - 'scripts/prepare-ac4.mjs'
      - 'crates/sda-native/**'
      - 'crates/sda-render-metadata/**'
      - 'vendor/truehd/**'
      - 'apps/native-renderer/**'
      - 'packages/core/**'
      - 'packages/demux/**'
      - 'vendor/avs3a/**'
      - 'vendor/macindecode-ac4-scene/**'
      - 'vendor/macindecode-ac4-decode/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: write
  actions: write
concurrency:
  group: ios-port-${{ inputs.source_ref || github.event.client_payload.source_ref || github.sha }}-${{ inputs.scope || github.event.client_payload.scope || 'package-only' }}
  cancel-in-progress: true
jobs:
  shared-cache-entry:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Start package in the default-branch cache scope
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref || github.sha }}
          PACKAGE_SCOPE: 'package-only'
          RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || '' }}
        with:
          script: |
            const requested=process.env.SOURCE_REF;
            const {data:source}=await github.rest.repos.getCommit({...context.repo,ref:requested});
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'ios-shared-cache.yml',ref:context.payload.repository.default_branch,inputs:{source_ref:source.sha,scope:process.env.PACKAGE_SCOPE,release_tag:process.env.RELEASE_TAG}});
            await core.summary.addHeading('iOS shared build cache').addRaw(`Requested source: ${requested}\n\nPinned source: ${source.sha}\n\nBuild and cache scope: ${context.payload.repository.default_branch}\n\n`).addLink('Open the shared packaging runs',`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ios-shared-cache.yml`).write();
  device-ios:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: iOS device package
    runs-on: xcode-27
    timeout-minutes: 100
    env:
      CI: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/ios-build/cargo
      SDA_IOS_INCLUDE_SIMULATOR: '0'
      SDA_PACKAGE_SCOPE: 'package-only'
      SDA_PACKAGE_TESTS: '0'
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_USE_PREBUILT_RNCORE: '0'
      RCT_USE_RN_DEP: '0'
      EXPO_USE_PRECOMPILED_MODULES: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.client_payload.source_ref || github.sha }}
          submodules: recursive
      - name: Select Xcode and verify iOS SDK
        run: python3 scripts/select-apple-toolchain.py --xcode-version '27.1' --ios-sdk-version '27.1' --host-major 27 --record-dir ios-artifacts
      - name: Record build tools
        id: xcode
        run: |
          xcodebuild -version | tee ios-artifacts/xcode.txt
          echo "fingerprint=$(shasum -a 256 ios-artifacts/xcode.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sda-native -> ../../ios-build/cargo
          shared-key: ios-device-release
          key: ios-device-${{ steps.xcode.outputs.fingerprint }}
          cache-on-failure: true
      - name: Validate provenance inputs and pin runtime source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          export SDA_SOURCE_COMMIT="$source_sha"
          echo "SDA_SOURCE_COMMIT=$source_sha" >> "$GITHUB_ENV"
          node scripts/record-ios-build.mjs --check-inputs
      - name: Install dependencies and prepare resources
        run: |
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          node scripts/patch-expo-module-scan-timeout.mjs
          node scripts/prepare-ios-assets.mjs
      - name: Build device Rust library
        run: |
          set -o pipefail
          GITHUB_SHA="$SDA_SOURCE_COMMIT" bash scripts/build-ios-native.sh 2>&1 | tee ios-artifacts/rust-build.log
      - name: Restore on-device TrueDepth framework
        id: fusion-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/modules/sda-core/ios/StandardCyborgFusion.xcframework
            apps/mobile/modules/sda-core/ios/PersonalHrtfFusion/FaceFrame
            apps/mobile/modules/sda-core/ios/Licenses/StandardCyborg
            apps/mobile/modules/sda-core/ios/Licenses/FaceFrame
            ios-artifacts/personal-scan-framework.json
            ios-artifacts/PERSONAL-HRTF-TEST-README-zh.md
          key: fusion-device-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('scripts/package-ios-personal-scan.sh', 'scripts/build-ios-personal-scan-fusion.sh', 'scripts/stage-ios-personal-scan-fusion.py', 'scripts/patch-ios-personal-scan-fusion.py', 'scripts/stage-faceframe-scan.py', 'scripts/test-ios-personal-tracking.py', 'scripts/test-ios-personal-prediction.py', 'scripts/test/personal-hrtf-tracking*.cpp', 'apps/mobile/modules/sda-core/ios/PersonalHrtfNative/*.hpp', 'apps/mobile/modules/sda-core/ios/PersonalHrtfNative/SdaHrtfMesh.h', 'apps/mobile/modules/sda-core/ios/PersonalHrtfFusion/PersonalHrtfReconstruction.swift') }}
      - name: Embed on-device TrueDepth framework
        if: steps.fusion-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/package-ios-personal-scan.sh 2>&1 | tee ios-artifacts/personal-scan-package.log
      - name: Restore CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/modules/**/*.podspec') }}
          restore-keys: |
            ios-pods-v1-${{ steps.xcode.outputs.fingerprint }}-
      - name: Generate Xcode project and install CocoaPods
        run: |
          set -o pipefail
          cd apps/mobile
          pnpm exec expo prebuild --platform ios --no-install 2>&1 | tee ../../ios-artifacts/prebuild.log
          cd ios
          pod install 2>&1 | tee ../../../ios-artifacts/pods.log
      - name: Restore Xcode compilation cache
        uses: actions/cache@v4
        with:
          path: ios-build/CompilationCache.noindex
          key: ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/modules/sda-core/ios/*.swift', 'apps/mobile/modules/sda-core/ios/*.h', 'apps/mobile/modules/sda-core/ios/Headers/**') }}-${{ github.run_id }}
          restore-keys: |
            ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/*.podspec', 'apps/mobile/modules/sda-core/ios/*.swift', 'apps/mobile/modules/sda-core/ios/*.h', 'apps/mobile/modules/sda-core/ios/Headers/**') }}-
            ios-compile-v1-${{ steps.xcode.outputs.fingerprint }}-
      - name: Archive unsigned device app
        run: |
          set -o pipefail
          xcodebuild -showBuildTimingSummary -workspace apps/mobile/ios/SDA.xcworkspace -scheme SDA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ios-build/SDA.xcarchive -derivedDataPath ios-build/device COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES COMPILATION_CACHE_CAS_PATH="$PWD/ios-build/CompilationCache.noindex" COMPILATION_CACHE_LIMIT_SIZE=2G CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET=16.4 archive 2>&1 | tee ios-artifacts/device-build.log
          mkdir -p ios-build/package/Payload
          cp -R ios-build/SDA.xcarchive/Products/Applications/SDA.app ios-build/package/Payload/
          python3 scripts/strip-ios-ci-resources.py ios-build/package/Payload/SDA.app | tee ios-artifacts/production-resource-audit.json
          xcrun dwarfdump --uuid ios-build/SDA.xcarchive/Products/Applications/SDA.app/SDA > ios-artifacts/device-uuid.txt
          node scripts/record-ios-build.mjs ios-artifacts
          cd ios-build/package
          zip -qry ../../ios-artifacts/SDA-unsigned-ios16.4-arm64.ipa Payload
          cd ../..
          printf 'Unsigned arm64 device IPA; packaging only, no regression tests executed. Requires signing for installation.\n' > ios-artifacts/README.txt
      - name: Audit package source and IPA
        run: python3 scripts/verify-ios-device-package.py ios-artifacts/SDA-unsigned-ios16.4-arm64.ipa
      - name: Record compilation timings
        if: always()
        run: python3 scripts/summarize-ios-build-timings.py ios-artifacts
      - name: Upload versioned package to requested draft release
        if: ${{ inputs.release_tag != '' }}
        env:
          SDA_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upload-mobile-release.mjs iOS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDA-iOS-device-${{ github.run_number }}
          path: ios-artifacts/
          retention-days: 14
