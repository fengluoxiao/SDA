name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build desktop assets for
        required: true
        type: string
      platform:
        description: Desktop platforms to build
        required: true
        type: choice
        default: both
        options:
          - both
          - windows
          - macos

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    name: Windows NSIS installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core

      - name: Install wasm-bindgen-cli (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare decoder build inputs and WASM modules
        uses: ./.github/actions/prepare-decoders

      - name: Prepare ASIO build dependencies
        uses: ./.github/actions/prepare-asio

      - name: Fetch Windows native dependencies
        run: |
          cargo fetch --locked --manifest-path apps/head-tracking-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path apps/native-renderer/Cargo.toml

      - name: Build Windows helper and native renderer
        run: |
          node scripts/build-head-tracking-helper.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-native-renderer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/stage-head-tracking-driver.mjs

      - name: Build web
        run: pnpm --filter @sda/web build

      - name: Package Electron (NSIS)
        run: pnpm --filter @sda/desktop exec electron-builder --win nsis --x64 --arm64 --publish never '-c.win.artifactName=SDA Setup ${version}-universal.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'macos' }}
    name: macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core

      - name: Install wasm-bindgen-cli (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare decoder build inputs and WASM modules
        uses: ./.github/actions/prepare-decoders

      - name: Build web + package Electron (unsigned DMG)
        run: |
          if [ '${{ matrix.arch }}' = 'arm64' ]; then export SDA_NATIVE_TARGET=aarch64-apple-darwin; else export SDA_NATIVE_TARGET=x86_64-apple-darwin; fi
          rustup target add "$SDA_NATIVE_TARGET"
          cargo fetch --locked --manifest-path apps/native-renderer/Cargo.toml
          cargo fetch --locked --manifest-path apps/head-tracking-helper/Cargo.toml
          node scripts/build-head-tracking-helper.mjs
          node scripts/build-native-renderer.mjs
          pnpm --filter @sda/web build
          pnpm --filter @sda/desktop exec electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error

  publish-release:
    if: ${{ always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    name: Publish release assets
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload requested desktop assets to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
          fail_on_unmatched_files: false
          generate_release_notes: false
