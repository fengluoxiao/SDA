name: Desktop release installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app source and draft release tag
        required: true
        type: string
      source_ref:
        description: Optional immutable app source commit
        required: false
        type: string
      web_source_run:
        description: Optional successful shared-web build run for the same app source
        required: false
        type: string
      platform:
        description: Desktop platforms to build
        required: true
        type: choice
        default: both
        options: [both, windows, macos]
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-release-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build-web:
    if: ${{ inputs.web_source_run == '' }}
    name: Shared desktop web and decoder assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
          key: desktop-wasm-v1
      - name: Install pinned wasm-bindgen tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          gh release download 0.2.127 --repo wasm-bindgen/wasm-bindgen --pattern 'wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP/wasm-bindgen"
          echo "61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  $RUNNER_TEMP/wasm-bindgen/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-bindgen/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - uses: ./.github/actions/prepare-decoders
      - name: Build shared web resources
        run: pnpm --filter @sda/web build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: |
            apps/web/dist/
            apps/desktop/remote-web/
            apps/desktop/performance-framing.cjs
            packages/core/pkg-node/
          if-no-files-found: error
  build-windows:
    if: ${{ always() && (needs.build-web.result == 'success' || inputs.web_source_run != '') && (inputs.platform == 'both' || inputs.platform == 'windows') }}
    needs: build-web
    name: Windows ${{ matrix.arch }} installer
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc: amd64
            folder: win-unpacked
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc: amd64_arm64
            folder: win-arm64-unpacked
    env:
      SDA_NATIVE_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-native
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_BUILD_JOBS: '3'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/native-renderer -> ../../desktop-native
            apps/head-tracking-helper -> ../../desktop-native
          key: desktop-windows-${{ matrix.arch }}-v1
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Stage pinned packaging tools
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises'),path=require('node:path'),cp=require('node:child_process');
            const source=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const previous=context.payload.inputs.web_source_run;
            if(previous){
              const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(previous)});
              if(run.data.head_sha!==source)throw Error('Shared web artifacts must match the application source');
              const jobs=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:Number(previous)});
              if(!jobs.data.jobs.some(j=>j.name==='Shared desktop web and decoder assets'&&j.conclusion==='success'))throw Error('Shared decoder build did not pass');
            }
            const tools=path.join(process.env.RUNNER_TEMP,'sda-packaging-tools');await fs.mkdir(tools,{recursive:true});
            for(const name of ['prepare-desktop-release.mjs','verify-desktop-release.py','upload-desktop-release.mjs','upload-mobile-release.mjs']){
              const result=await github.rest.repos.getContent({...context.repo,path:'scripts/'+name,ref:process.env.GITHUB_WORKFLOW_SHA});
              await fs.writeFile(path.join(tools,name),Buffer.from(result.data.content,'base64'));
            }
            core.exportVariable('SDA_RELEASE_TOOLS',tools);
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: .
          run-id: ${{ inputs.web_source_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/prepare-asio
      - name: Build target-native desktop components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SDA_SOURCE_COMMIT = (git rev-parse HEAD).Trim()
          node scripts/prepare-ac4.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path apps/head-tracking-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path apps/native-renderer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-head-tracking-helper.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-native-renderer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -eq 'x64') { node scripts/stage-head-tracking-driver.mjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Package architecture-specific installer
        shell: pwsh
        run: |
          node "$env:SDA_RELEASE_TOOLS/prepare-desktop-release.mjs" Windows ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @sda/desktop exec electron-builder --config release-config.json --win nsis --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual installer payload
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          python "$env:SDA_RELEASE_TOOLS/verify-desktop-release.py" --platform Windows --arch ${{ matrix.arch }} --app-dir apps/desktop/dist/${{ matrix.folder }} --installer "apps/desktop/dist/SDA-$version-Windows-${{ matrix.arch }}.exe" --verify-container
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified installer to draft release
        env:
          SDA_RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node "$env:SDA_RELEASE_TOOLS/upload-desktop-release.mjs" Windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDA-Windows-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            apps/desktop/dist/*.exe
            desktop-artifacts/
          if-no-files-found: warn
  build-macos:
    if: ${{ always() && (needs.build-web.result == 'success' || inputs.web_source_run != '') && (inputs.platform == 'both' || inputs.platform == 'macos') }}
    needs: build-web
    name: macOS ${{ matrix.arch }} installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
            folder: mac
          - arch: arm64
            runner: macos-26
            target: aarch64-apple-darwin
            folder: mac-arm64
    env:
      SDA_NATIVE_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-native
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/native-renderer -> ../../desktop-native
            apps/head-tracking-helper -> ../../desktop-native
          key: desktop-macos-${{ matrix.arch }}-v1
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Stage pinned packaging tools
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises'),path=require('node:path'),cp=require('node:child_process');
            const source=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const previous=context.payload.inputs.web_source_run;
            if(previous){
              const run=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(previous)});
              if(run.data.head_sha!==source)throw Error('Shared web artifacts must match the application source');
              const jobs=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:Number(previous)});
              if(!jobs.data.jobs.some(j=>j.name==='Shared desktop web and decoder assets'&&j.conclusion==='success'))throw Error('Shared decoder build did not pass');
            }
            const tools=path.join(process.env.RUNNER_TEMP,'sda-packaging-tools');await fs.mkdir(tools,{recursive:true});
            for(const name of ['prepare-desktop-release.mjs','verify-desktop-release.py','upload-desktop-release.mjs','upload-mobile-release.mjs']){
              const result=await github.rest.repos.getContent({...context.repo,path:'scripts/'+name,ref:process.env.GITHUB_WORKFLOW_SHA});
              await fs.writeFile(path.join(tools,name),Buffer.from(result.data.content,'base64'));
            }
            core.exportVariable('SDA_RELEASE_TOOLS',tools);
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: .
          run-id: ${{ inputs.web_source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build native components and package DMG
        run: |
          export SDA_SOURCE_COMMIT="$(git rev-parse HEAD)"
          node scripts/prepare-ac4.mjs
          cargo fetch --locked --manifest-path apps/head-tracking-helper/Cargo.toml
          cargo fetch --locked --manifest-path apps/native-renderer/Cargo.toml
          node scripts/build-head-tracking-helper.mjs
          node scripts/build-native-renderer.mjs
          node "$SDA_RELEASE_TOOLS/prepare-desktop-release.mjs" macOS ${{ matrix.arch }}
          pnpm --filter @sda/desktop exec electron-builder --config release-config.json --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify mounted DMG payload
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          python3 "$SDA_RELEASE_TOOLS/verify-desktop-release.py" --platform macOS --arch ${{ matrix.arch }} --app-dir apps/desktop/dist/${{ matrix.folder }}/SDA.app --installer "apps/desktop/dist/SDA-$version-macOS-${{ matrix.arch }}.dmg" --verify-container
      - name: Upload verified installer to draft release
        env:
          SDA_RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node "$SDA_RELEASE_TOOLS/upload-desktop-release.mjs" macOS ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDA-macOS-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            apps/desktop/dist/*.dmg
            desktop-artifacts/
          if-no-files-found: warn
