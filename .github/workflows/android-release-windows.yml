name: Android official release (Windows)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional immutable app source commit
        required: false
        type: string
      release_tag:
        description: Optional existing draft release tag to upload packages to
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: android-official-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/android-rust
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sda-native -> ../../android-rust
          key: android-windows-ndk27-release
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-release-${{ hashFiles('apps/mobile/android/**/*.gradle', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: gradle-windows-release-
      - name: Install dependencies and Android tools
        run: |
          pnpm install --prod=false --frozen-lockfile --config.node-linker=hoisted
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          node scripts/prepare-ac4.mjs
          if ($LASTEXITCODE -ne 0) { throw 'AC4 preparation failed' }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'cmdline-tools;23.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android command-line tools install failed' }
          & "$env:ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager.bat" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK install failed' }
      - name: Verify shared Android and iOS lyrics UI
        run: |
          node scripts/test-mobile-lyrics.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shared lyrics UI regression failed' }
      - name: Test ALAC file decoding and resampling
        run: |
          cargo test --manifest-path scripts/alac-file-regression/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'ALAC file decoder regression failed' }
      - name: Verify seek restart reaches actual rendered audio
        env:
          MACINDECODE_AC4_SPEC_DIR: ${{ github.workspace }}/tmp/MacinDecode-AC4-Core/spec
        run: |
          cargo test --manifest-path crates/sda-native/Cargo.toml --locked --release --no-default-features --test android_seek_feed -j 2 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Seek restart audio/clock regression failed' }
      - name: Build and verify official APK
        run: ./scripts/build-android-release-windows.ps1
        env:
          SDA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SDA_ANDROID_KEYSTORE_BASE64 }}
          SDA_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SDA_ANDROID_RELEASE_STORE_PASSWORD }}
          SDA_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.SDA_ANDROID_RELEASE_KEY_ALIAS }}
          SDA_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SDA_ANDROID_RELEASE_KEY_PASSWORD }}
      - name: Verify lyrics UI in packaged APK
        run: |
          python scripts/verify-mobile-lyrics-package.py Android android-artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Android lyrics UI verification failed' }
      - name: Verify Android feed gate matches iOS seek pause intent
        run: |
          python scripts/test-android-seek-feed.py --fetch-test-dependencies
          if ($LASTEXITCODE -ne 0) { throw 'Android production seek feed gate regression failed' }
      - name: Upload versioned package to requested draft release
        if: ${{ inputs.release_tag != '' }}
        env:
          SDA_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upload-mobile-release.mjs Android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDA-Android-Windows-${{ github.run_number }}
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 14
